async function fetchUserData() {
    try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        console.log(response);
        console.log(response.status);

        const userData = await response.json();

        console.log(userData);
        let tbody=document.getElementById("tbody");

        for(var i=0;i<userData.length;i++){
            let row=document.createElement("tr");

            let idColumn=document.createElement("td");
            let nameColumn=document.createElement("td");
            let userNameColumn=document.createElement("td");
            let emailColumn=document.createElement("td");
            let phoneColumn=document.createElement("td");

            const {id,name,username,email,phone} = userData[i];

            idColumn.innerHTML = id;
            nameColumn.innerHTML = name;
            userNameColumn.innerHTML = username;
            emailColumn.innerHTML=email;
            phoneColumn.innerHTML=phone;


            row.appendChild(idColumn);
            row.appendChild(nameColumn);
            row.appendChild(userNameColumn);
            row.appendChild(emailColumn);
            row.appendChild(phoneColumn);


            tbody.appendChild(row);

        }

    } catch (error) {
        console.log(error);
    }
}

fetchUserData();
