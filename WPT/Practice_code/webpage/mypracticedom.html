                <div class="container">
                    <h2>Student Marks Calculator</h2>
                    <label>Subject 1:</label>
                    <input type="number" id="m1" placeholder="Enter marks">
                    <label>Subject 2:</label>
                    <input type="number" id="m2" placeholder="Enter marks">
                    <label>Subject 3:</label>
                    <input type="number" id="m3" placeholder="Enter marks">
                    <button onclick="calculate()">Calculate</button>
                    <p id="result"></p>
                </div>
                <script>
                    function calculate() {
                        let m1 = Number(document.getElementById("m1").value);
                        let m2 = Number(document.getElementById("m2").value);
                        let m3 = Number(document.getElementById("m3").value);
                        let result = document.getElementById("result");

                        if (document.getElementById("m1")
                            .value === "" || document.getElementById("m2")
                                .value === "" || document.getElementById("m3")
                                    .value === "") {
                            result.textContent = "Please enter all marks";
                            result.style.color = "red";
                            return;
                        } if (m1 < 0 || m1 > 100 || m2 < 0 || m2 > 100 || m3 < 0 || m3 > 100) {
                            result.textContent = "Marks must be between 0 and 100";
                            result.style.color = "red";
                            return;
                        }
                        let total = m1 + m2 + m3;
                        let percentage = total / 3;
                        let status; if (m1 >= 35 && m2 >= 35 && m3 >= 35) { status = "Pass"; } else {
                            status = "Fail";


                        } result.innerHTML = "Total Marks: " + total + " / 300<br>"
                            + "Percentage: " + percentage.toFixed(2) + "%<br>" +
                            "Result: " + status; if (status === "Pass") {
                            result.style.color = "green";

                        } else { result.style.color = "red"; }
                    } 

 </script>
