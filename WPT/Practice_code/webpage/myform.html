<html>
    <head>
        <title>Registration form</title>

    <body>

        <label>Password: </label>
        <input type="password" id="password" placeholder="Enter Your password">

        <Label>Confirm Password: </Label>
        <input type="password" id="confirmPassword" placeholder="Enter Your correct password">

        <br><br>
        <label>Hobbies</label>
        <input type="checkbox" name="hobbies" value="play">play
        <input type="checkbox" name="hobbies" value="swimming">swiiming

        <br><br>

        </form>


        <script>
           function validateForm(){
            let name=document.getElementById("name").value.trim();
            let email=document.getElementById("email").value.trim();
            let password=document.getElementById("password").value;
            let confirmPassword=document.getElementById("confirmPassword").value;
            let city=document.getElementById("city").value;

            if(name===""){
                alert("enter your name");
                return false;
            }

            if(!email.include("@")|| !email.include(".")){
                alert("Enter valid email");
                return false;
            }
            let hobbies =
                document.querySelectorAll(
                    'input[name="hobby"]:checked'

           }

</html>
