<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova Employee Onboarding</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav id="main-nav">

        <h2>TechNova Solutions</h2>

        <div>
            <a href="login.html">Login</a>
            <a href="directory.html">Directory</a>
            <a href="onboarding.html">Onboarding</a>
        </div>

    </nav>

    <main class="page-container">

        <h1>Employee Onboarding Form</h1>

        <p>Complete the form to begin your joining process.</p>

        <form id="onboardingForm" onsubmit="return validateOnboarding()">

            <label for="fullName">Full Name:</label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <span id="nameError" class="error"></span>


            <label for="email">Official Email:</label>

            <input
                type="text"
                id="email"
                name="email"
                placeholder="name@company.com"
                required
            >

            <span id="emailError" class="error"></span>


            <label for="temporaryPassword">Temporary Password:</label>

            <input
                type="password"
                id="temporaryPassword"
                name="temporaryPassword"
                placeholder="Enter temporary password"
                required
            >


            <label for="dob">Date of Birth:</label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >


            <label for="joiningDate">Joining Date:</label>

            <input
                type="date"
                id="joiningDate"
                name="joiningDate"
                required
            >


            <label for="orientation">Orientation Slot:</label>

            <input
                type="datetime-local"
                id="orientation"
                name="orientation"
                required
            >


            <label for="reportingTime">Reporting Time:</label>

            <input
                type="time"
                id="reportingTime"
                name="reportingTime"
                required
            >


            <p><strong>Gender:</strong></p>

            <label>
                <input type="radio" name="gender" value="Male" required>
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="Female">
                Female
            </label>

            <label>
                <input type="radio" name="gender" value="Other">
                Other
            </label>


            <label for="qualification">Highest Qualification:</label>

            <select id="qualification" name="qualification" required>

                <option value="">Select Qualification</option>

                <option value="Diploma">Diploma</option>

                <option value="Bachelor">Bachelor's Degree</option>

                <option value="Master">Master's Degree</option>

                <option value="PhD">PhD</option>

            </select>

            <span id="qualificationError" class="error"></span>


            <label for="department">Department:</label>

            <select id="department" name="department" required>

                <option value="">Select Department</option>

                <option value="IT">IT</option>

                <option value="HR">HR</option>

                <option value="Finance">Finance</option>

                <option value="Marketing">Marketing</option>

                <option value="Sales">Sales</option>

            </select>

            <span id="departmentError" class="error"></span>


            <label for="address">Current Address:</label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your current address"
                rows="4"
                required
            ></textarea>


            <label for="document">Passport Photo or Resume:</label>

            <input
                type="file"
                id="document"
                name="document"
                required
            >


            <label>
                <input type="checkbox" id="declaration" required>
                I declare that the information provided is correct.
            </label>


            <div class="button-row">

                <button type="submit" class="submit-btn">
                    Submit
                </button>

                <button type="reset">
                    Reset
                </button>

                <!-- Plain button: no click handler, so it does nothing yet. -->
                <button type="button">
                    Need Help?
                </button>

            </div>

        </form>

        <div id="onboardingStatus"></div>

        <h2>TechNova Office Location</h2>

        <iframe
            title="Office location map"
            src="https://maps.google.com/maps?q=Kharghar%20Navi%20Mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"
            width="100%"
            height="300"
            style="border:0;"
            loading="lazy">
        </iframe>

    </main>

    <script src="js/onboarding.js"></script>

</body>

</html>
