<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova Solutions | HR Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="login-page">
    <nav>
        <h2>TechNova Solutions</h2>

        <div class="nav-links">
            <a href="login.html">Login</a>
            <a href="directory.html">Employee Directory</a>
            <a href="onboarding.html">Onboarding</a>
        </div>
    </nav>


    <main class="login-container">
        <div class="login-card">

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Sign in to access your employee portal.
            </p>

            <form action="#" method="post">

                <label for="username">Username</label>

                <input type="text"
                    id="username"
                    name="username"
                    class="login-input"
                    placeholder="Enter your username"
                    required>

                <label for="password">Password</label>
                <input type="password"
                    id="password"
                    name="password"
                    class="login-input"
                    placeholder="Enter your password"
                    required>

                <button type="submit" id="login-btn">Login</button>
            </form>
            <p class="signup-text">
                Need an account?<a href="onboarding.html" class="signup-link">Sign Up</a>
            </p>
        </div>
    </main>
</body>
</html>
